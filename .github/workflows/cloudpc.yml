name: Cloud PC

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Install desktop
      run: |
        sudo apt update
        sudo apt install -y xfce4 xfce4-goodies
        sudo apt install -y xvfb x11vnc novnc websockify pulseaudio

    - name: Install Chrome
      run: |
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt -f install -y

    - name: Start display
      run: |
        Xvfb :1 -screen 0 1280x720x24 &
        export DISPLAY=:1
        startxfce4 &

    - name: Start VNC
      run: |
        x11vnc -display :1 -nopw -forever -shared -rfbport 5901 &

    - name: Start noVNC
      run: |
        websockify --web=/usr/share/novnc/ 6080 localhost:5901 &

    - name: Public URL
      run: |
        npx localtunnel --port 6080
